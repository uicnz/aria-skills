interface:
  display-name: "Figma Implement Design"
  short-description: "Turn Figma designs into production-ready code"
  icon-small: "./assets/figma-small.svg"
  icon-large: "./assets/figma.png"
  default-prompt: "Implement this Figma design in this codebase, matching layout, states, and responsive behavior."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Figma MCP server"
      transport: "streamable-http"
      url: "https://mcp.figma.com/mcp"
