interface:
  display-name: "Render Deploy"
  short-description: "Deploy applications to Render via Blueprints or MCP"
  icon-small: "./assets/render-small.svg"
  icon-large: "./assets/render.png"
  default-prompt: "Deploy this application to Render and provide service URL, env vars, and next checks."

dependencies:
  tools:
    - type: "mcp"
      value: "render"
      description: "Render MCP server"
      transport: "streamable-http"
      url: "https://mcp.render.com/mcp"
