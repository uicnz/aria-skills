interface:
  display-name: "Notion Spec to Implementation"
  short-description: "Turn Notion specs into implementation plans, tasks, and progress tracking"
  icon-small: "./assets/notion-small.svg"
  icon-large: "./assets/notion.png"
  default-prompt: "Turn this Notion spec into an implementation plan with milestones, tasks, and dependencies."

dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Notion MCP server"
      transport: "streamable-http"
      url: "https://mcp.notion.com/mcp"
