interface:
  displayName: "QA"
  shortDescription: "Systematically test a web app, fix bugs, and verify each fix."
  defaultPrompt: "Use /ship/qa to test the target app, fix the issues you find, and verify each fix before finishing."

policy:
  userInvokable: true
  allowImplicitInvocation: false
  allowedTools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - AskUserQuestion
    - WebSearch
