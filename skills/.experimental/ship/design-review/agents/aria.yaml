interface:
  displayName: "Design Review"
  shortDescription: "Visual QA and fix loop for UI consistency, hierarchy, and polish."
  defaultPrompt: "Use /ship/design-review to audit the live UI, fix visual issues, and verify the results with evidence."

policy:
  userInvokable: true
  allowImplicitInvocation: false
  allowedTools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - AskUserQuestion
    - WebSearch
