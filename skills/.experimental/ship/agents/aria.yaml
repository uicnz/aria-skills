interface:
  displayName: "Ship"
  shortDescription: "Entrypoint skill for the full ship workflow and related child skills."
  defaultPrompt: "Use the ship entrypoint for the complete release workflow, and surface child ship skills when a narrower QA, review, browse, or release-support task is needed."

instructions:
  load:
    - "./instructions.md"

policy:
  userInvokable: true
  allowImplicitInvocation: false
  allowedTools:
    - Bash
    - Read
    - Write
    - Edit
    - Grep
    - Glob
    - AskUserQuestion
    - WebSearch

relationships:
  childSkills:
    - path: "./browse"
    - path: "./qa"
    - path: "./qa-only"
    - path: "./review"
    - path: "./retro"
    - path: "./plan-review-founder"
    - path: "./plan-review-eng"
    - path: "./plan-review-design"
    - path: "./design-review"
    - path: "./design-consultation"
    - path: "./document-release"
    - path: "./setup-browser-cookies"
    - path: "./ship-upgrade"
