name: Catalog check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out skills catalog
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install catalog dependencies
        run: bun install --frozen-lockfile

      - name: Inspect every tier and release unit
        run: bun scripts/catalog-check.ts skills
