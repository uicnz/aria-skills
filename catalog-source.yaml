schema: aria.skills.catalog-source/v1
catalogId: aria-official
authorityId: aria-official
sourceRepository: https://github.com/uicnz/aria-skills
publisher: uicnz
curator: aria
distributor: aria
channel: stable
rootKeyId: aria-skills-root-1
delegatedKeyId: aria-skills-release-1

domains:
  development:
    label: Software Development
    description: Build, test, and maintain software and developer tooling.
    order: 10
    categories:
      applications:
        label: Applications
        description: Build applications, services, and browser games.
        order: 10
      automation:
        label: Automation
        description: Automate, test, and debug browser and Electron interfaces.
        order: 20
      github:
        label: GitHub
        description: Manage continuous integration, review feedback, and pull requests.
        order: 30
      skills:
        label: Skills
        description: Create, migrate, audit, and normalize Aria skills.
        order: 40

  design:
    label: Design and Interfaces
    description: Design visual systems and translate design intent into interfaces.
    order: 20
    categories:
      visual:
        label: Visual
        description: Define visual direction, interface design, and color systems.
        order: 10
      figma:
        label: Figma
        description: Inspect Figma designs and translate them into production code.
        order: 20

  operations:
    label: Delivery and Operations
    description: Deploy, observe, and operate production software.
    order: 30
    categories:
      deployment:
        label: Deployment
        description: Publish and configure applications on hosting platforms.
        order: 10
      observability:
        label: Observability
        description: Inspect production errors, events, and operational health.
        order: 20

  security:
    label: Security
    description: Assess software risk, ownership, and abuse paths.
    order: 40
    categories:
      appsec:
        label: AppSec
        description: Review secure implementation, ownership risk, and threat exposure.
        order: 10

  content:
    label: Content and Media
    description: Create, transform, and inspect documents, data, images, video, and audio.
    order: 50
    categories:
      documents:
        label: Documents
        description: Create, edit, and review text documents and PDFs.
        order: 10
      presentations:
        label: Presentations
        description: Create, edit, and diagnose presentation decks.
        order: 20
      spreadsheets:
        label: Spreadsheets
        description: Create, edit, analyze, and review structured tabular data.
        order: 30
      notebooks:
        label: Notebooks
        description: Create and maintain computational notebooks and tutorials.
        order: 40
      visual:
        label: Visual
        description: Generate, edit, manage, and capture images and video.
        order: 50
      audio:
        label: Audio
        description: Transcribe recordings and generate spoken audio.
        order: 60

  productivity:
    label: Knowledge and Planning
    description: Capture knowledge, plan work, and coordinate projects.
    order: 60
    categories:
      knowledge:
        label: Knowledge
        description: Capture and synthesize structured organizational knowledge.
        order: 10
      planning:
        label: Planning
        description: Prepare meetings and turn specifications into actionable plans.
        order: 20
      projects:
        label: Projects
        description: Organize issues, projects, and team workflows.
        order: 30

